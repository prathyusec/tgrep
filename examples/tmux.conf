# ---------------------------------------------------------------------------
# tgrep — Telegram-style fuzzy search popup
# ---------------------------------------------------------------------------
# Add to the bottom of ~/.tmux.conf, then:
#     tmux source-file ~/.tmux.conf

# Ctrl+F opens a floating search over the current pane's scrollback
bind -n C-f display-popup -E -w 90% -h 70% "$HOME/.local/bin/tgrep-tmux"

# Optional: keep tmux's native search on prefix + /
bind / command-prompt -p "search down:" "copy-mode -e ; send-keys /"
